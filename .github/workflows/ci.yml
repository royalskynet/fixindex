name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
      GIT_AUTHOR_NAME: fixindex CI
      GIT_AUTHOR_EMAIL: ci@example.invalid
      GIT_COMMITTER_NAME: fixindex CI
      GIT_COMMITTER_EMAIL: ci@example.invalid
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python3" -m pip install -r requirements.txt numpy==2.2.6
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Run Linux regression tests
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD:$PATH"
          for test in test_*.py; do
            echo "===== $test ====="
            python3 "$test"
          done
          for test in test_*.sh hooks/*.test.sh; do
            case "$test" in
              # Requires the owner's real runbook entries, absent in a fresh checkout.
              test_find_spill.sh) echo "SKIP $test (requires real entries)"; continue ;;
              test_two_device_collision.sh)
                for mode in online offline; do
                  echo "===== $test $mode ====="
                  bash "$test" "$mode"
                done
                continue ;;
            esac
            echo "===== $test ====="
            bash "$test"
          done

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan checkout with redacted output
        run: '"$RUNNER_TEMP/gitleaks" dir . --redact=100 --no-banner --config tools/gitleaks.toml'
